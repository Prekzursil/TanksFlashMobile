name: Release Steward Weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Open weekly release stewardship issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Weekly release stewardship checklist (${date})`;
            const body = [
              "## Weekly Release Stewardship Checklist",
              "",
              "- [ ] Run deterministic verification (`make verify`).",
              "- [ ] Validate expected release artifacts by platform.",
              "- [ ] Check open medium/high-risk PR rollback notes.",
              "- [ ] Review dependency updates and compatibility impact.",
              "- [ ] Update release docs/changelog as needed.",
              "",
              "This issue is generated automatically to keep release readiness visible."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["area:release", "risk:low"]
            });
