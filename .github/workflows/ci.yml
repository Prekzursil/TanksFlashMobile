name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify versions match VERSION
        run: node ../../scripts/sync_versions.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Upload web build (dist)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: warn

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: apps/web/output/smoke
          if-no-files-found: warn

  remake_web:
    name: Remake (web spike) build + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remake-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/remake-web/package-lock.json

      - name: Verify versions match VERSION
        run: node ../../scripts/sync_versions.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Upload remake web build (dist)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remake-web-dist
          path: apps/remake-web/dist
          if-no-files-found: warn

      - name: Upload remake smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remake-web-smoke
          path: apps/remake-web/output/smoke
          if-no-files-found: warn

  desktop_windows:
    name: Desktop (Windows package)
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build web
        run: npm run build
        working-directory: apps/web

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Prepare Windows code signing certificate (optional)
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "tanks-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String("${env:WINDOWS_CERT_PFX_BASE64}"))
          "WIN_CSC_LINK=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Windows app
        run: npm run package:win
        working-directory: apps/desktop

      - name: Upload desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/dist
          if-no-files-found: warn

  android_debug:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build web
        run: npm run build
        working-directory: apps/web

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: android

      - name: Upload Android debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: warn

  ios_simulator:
    name: iOS (simulator .app)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build web
        run: npm run build
        working-directory: apps/web

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: Install CocoaPods
        run: pod install
        working-directory: ios/App

      - name: Build iOS simulator app
        working-directory: ios/App
        run: |
          set -euo pipefail
          DERIVED_DATA="${RUNNER_TEMP}/DerivedData"

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Package simulator .app
        run: |
          set -euo pipefail
          DERIVED_DATA="${RUNNER_TEMP}/DerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          OUT_DIR="ios-simulator-out"
          OUT_ZIP="$OUT_DIR/Tanks-ios-simulator-app.zip"

          mkdir -p "$OUT_DIR"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected .app not found at: $APP_PATH"
            echo "Searching DerivedData for .app bundles:"
            find "$DERIVED_DATA" -maxdepth 6 -type d -name '*.app' -print || true
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT_ZIP"
          echo "Created: $OUT_ZIP"

      - name: Upload iOS simulator artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: |
            ios-simulator-out/Tanks-ios-simulator-app.zip
            ios/App/xcodebuild.log
          if-no-files-found: warn

  godot_desktop:
    name: Godot (desktop exports)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    env:
      GODOT_VERSION: 4.2.2
      PROJECT_PATH: apps/remake-godot
      OUT_DIR: output/godot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare export templates
        run: |
          set -euo pipefail
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DST="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$(dirname "$DST")"
          if [ -d "$SRC" ] && [ ! -d "$DST" ]; then
            cp -a "$SRC" "$DST"
          fi

      - name: Export (Windows/Linux/macOS)
        run: |
          set -euo pipefail
          WORKSPACE="${GITHUB_WORKSPACE:-$(pwd)}"
          mkdir -p "${WORKSPACE}/${OUT_DIR}/windows" "${WORKSPACE}/${OUT_DIR}/linux" "${WORKSPACE}/${OUT_DIR}/macos"
          godot --headless --path "${WORKSPACE}/${PROJECT_PATH}" --export-release "Windows Desktop" "${WORKSPACE}/${OUT_DIR}/windows/Tanks.exe"
          godot --headless --path "${WORKSPACE}/${PROJECT_PATH}" --export-release "Linux/X11" "${WORKSPACE}/${OUT_DIR}/linux/Tanks.x86_64"
          godot --headless --path "${WORKSPACE}/${PROJECT_PATH}" --export-release "macOS" "${WORKSPACE}/${OUT_DIR}/macos/Tanks.zip"

      - name: Upload Godot (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-windows
          path: output/godot/windows
          if-no-files-found: warn

      - name: Upload Godot (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux
          path: output/godot/linux
          if-no-files-found: warn

      - name: Upload Godot (macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-macos
          path: output/godot/macos
          if-no-files-found: warn
