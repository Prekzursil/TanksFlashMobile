name: Applitools Visual

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/applitools-visual.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/applitools-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: applitools-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applitools:
    name: Applitools Visual
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify versions match VERSION
        run: node ../../scripts/sync_versions.mjs --check

      - name: Validate Applitools key
        run: |
          if [ -z "${{ secrets.APPLITOOLS_API_KEY }}" ]; then
            echo "APPLITOOLS_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build web
        run: npm run build

      - name: Run Applitools visual checks
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BATCH_NAME: GitHub-${{ github.workflow }}-${{ github.ref_name }}
        run: npm run e2e:applitools

      - name: Upload Applitools artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-applitools-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: warn
