version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
