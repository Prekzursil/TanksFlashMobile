<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanks Remake (Web Spike)</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand__title">Tanks</div>
          <div class="brand__subtitle">Web remake v1 (Canvas + TS)</div>
        </div>
        <div class="topbar__actions">
          <button id="start-btn" class="btn btn--primary" type="button">Start</button>
          <button id="reset-btn" class="btn" type="button" disabled>Reset</button>
          <button id="pause-btn" class="btn" type="button" disabled title="Pause/resume (Esc)">
            Pause
          </button>
          <button id="settings-btn" class="btn" type="button" title="Settings">Settings</button>
          <button id="fullscreen-btn" class="btn" type="button" title="Toggle fullscreen (f)">
            Fullscreen
          </button>
        </div>
      </header>

      <main class="stage">
        <div class="frame">
          <canvas id="game-canvas" width="1280" height="720"></canvas>

          <section id="hud-panel" class="hudpanel" hidden>
            <div id="hud-stats" class="hudpanel__stats">Loading…</div>
            <div id="hud-message" class="hudpanel__message"></div>
          </section>

          <section id="touch-controls" class="touch" hidden aria-label="Touch controls">
            <div class="touch__cluster touch__cluster--move" data-layout="move">
              <button class="touch__btn" type="button" data-hold="move_left" aria-label="Move left">
                ◀
              </button>
              <button class="touch__btn" type="button" data-hold="move_right" aria-label="Move right">
                ▶
              </button>
            </div>

            <div class="touch__cluster touch__cluster--aim" data-layout="aim">
              <div class="touch__row">
                <button class="touch__btn touch__btn--wide" type="button" data-hold="aim_left">
                  Angle −
                </button>
                <button class="touch__btn touch__btn--wide" type="button" data-hold="aim_right">
                  Angle +
                </button>
              </div>
              <div class="touch__row">
                <button class="touch__btn touch__btn--wide" type="button" data-hold="power_down">
                  Power −
                </button>
                <button class="touch__btn touch__btn--wide" type="button" data-hold="power_up">
                  Power +
                </button>
              </div>
              <button id="touch-fire" class="touch__btn touch__btn--fire" type="button">FIRE</button>
              <div class="touch__row">
                <button class="touch__btn" type="button" data-weapon="0">1</button>
                <button class="touch__btn" type="button" data-weapon="1">2</button>
                <button class="touch__btn" type="button" data-weapon="2">3</button>
              </div>
            </div>
          </section>

          <section id="modal-layer" class="modalLayer" hidden>
            <div id="pause-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
              <div class="modal__card">
                <div class="modal__title" id="pause-title">Paused</div>
                <div class="modal__actions">
                  <button id="pause-resume-btn" class="btn btn--primary" type="button">Resume</button>
                  <button id="pause-restart-btn" class="btn" type="button">Restart</button>
                  <button id="pause-settings-btn" class="btn" type="button">Settings</button>
                  <button id="pause-main-menu-btn" class="btn" type="button">Main Menu</button>
                </div>
              </div>
            </div>

            <div
              id="settings-modal"
              class="modal"
              role="dialog"
              aria-modal="true"
              aria-labelledby="settings-title"
              hidden
            >
              <div class="modal__card">
                <div class="modal__title" id="settings-title">Settings</div>
                <div class="modal__content">
                  <label class="field">
                    <input id="settings-touch-enabled" type="checkbox" />
                    <span>Enable touch controls overlay</span>
                  </label>

                  <label class="field field--row">
                    <span>Touch layout</span>
                    <select id="settings-touch-layout">
                      <option value="right">Right-handed</option>
                      <option value="left">Left-handed</option>
                    </select>
                  </label>

                  <label class="field field--row">
                    <span>Camera motion</span>
                    <select id="settings-camera-intensity">
                      <option value="default">Default</option>
                      <option value="low">Low</option>
                      <option value="off">Off</option>
                    </select>
                  </label>

                  <div class="hint">
                    Tip: press <span class="kbd">Esc</span> to pause. Use touch controls on phones/tablets.
                  </div>
                </div>
                <div class="modal__actions">
                  <button id="settings-close-btn" class="btn btn--primary" type="button">Close</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer class="footer">
        <div id="hud" class="hud">Loading…</div>
        <details class="help">
          <summary>Controls</summary>
          <div class="help__grid">
            <div><span class="kbd">A</span>/<span class="kbd">D</span> move (fuel)</div>
            <div><span class="kbd">←</span>/<span class="kbd">→</span> angle</div>
            <div><span class="kbd">↑</span>/<span class="kbd">↓</span> power</div>
            <div><span class="kbd">1</span>/<span class="kbd">2</span>/<span class="kbd">3</span> weapon</div>
            <div><span class="kbd">Space</span> fire</div>
            <div><span class="kbd">Esc</span> pause/resume</div>
            <div><span class="kbd">R</span> reset</div>
          </div>
        </details>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
