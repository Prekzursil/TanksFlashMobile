# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The gate runs `osv-scanner scan source --config=osv-scanner.toml --recursive .`
# and must report 0 actionable CVEs.
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not.
#
# Lockfiles scanned (recursive from repo root):
#   - package-lock.json                 (root tooling deps)
#   - apps/web/package-lock.json        (Capacitor/Vite web client)
#   - apps/remake-web/package-lock.json (remake web client)
#   - apps/desktop/package-lock.json    (Electron desktop shell)
#
# Add a dated, reasoned [[IgnoredVulns]] entry below only for a future vuln that is
# genuinely unfixable or provably unreachable, e.g.:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   # 2026-06-17 — <reason: unfixable upstream / not reachable in this product>.

# ---------------------------------------------------------------------------
# RETIRED 2026-11-01 — the 2026-07-25 brace-expansion (CVE-2026-14257,
# GHSA-mh99-v99m-4gvg) ignore EXPIRED 2026-10-23 and is removed. Patched
# backports now exist on every affected line (1.1.21 / 2.1.7 / 5.0.12, verified
# against the npm registry), so all four package.json override floors were
# raised to those versions instead of re-ignoring. The full per-parent analysis
# from 2026-07-25 lives in git history (osv-scanner.toml @ main~).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 2026-11-18 IGNORES RETIRED (measured, osv-scanner 2.3.8, gate-deps on main):
# the scan reports ZERO extract-zip and minimatch findings across all four
# lockfiles, so these five entries — the original extract-zip pair, its
# later duplicate pair (which osv-scanner 2.3.8 also flagged as
# "multiple ignores ... only the first will be used"), and the
# GHSA-g3hv-75wg-m249 minimatch entry — had all become UNUSED, and unused
# ignores fail the gate on their own. The per-parent analysis lives in git
# history. Re-add a dated, reasoned entry only if a matching finding returns.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 2026-11-18 RESIDUAL RISK (reasoned ignore) — GHSA-fc5q-39xc-vjpf, picomatch
# ReDoS (CVSS v3 7.5 / v4 8.7, availability-only; analyzeRepeatedExtglob
# exponential backtracking). Vulnerable range <= 4.0.7 and 4.0.7 IS the newest
# published release (measured 2026-11-18 via `npm view picomatch versions`),
# so there is NO fixed release to upgrade to — "0 vulnerabilities can be
# fixed", per the gate's own output. Measured scope in THIS tree (all four
# lockfiles, every copy "dev": true): pulled by the vite/vitest/jest/chromatic
# build+test toolchain; no runtime bundle ships picomatch. Impact ceiling is
# event-loop blockage in a developer's own tooling from a crafted glob.
# RE-CHECK: retire the day a patched picomatch (> 4.0.7) publishes — bump the
# override floor instead. Re-review at ignoreUntil regardless.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-18
reason = """
picomatch ReDoS; every published release is vulnerable (<= 4.0.7 = latest
published, measured 2026-11-18) so no upgrade exists. Dev-scope only: all
resolutions are dev=true via the vite/vitest/jest/chromatic toolchain and
picomatch never ships in the web, remake-web, or desktop bundles.
Availability-only impact. Retire as soon as a patched picomatch publishes.
"""
