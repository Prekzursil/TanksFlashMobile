# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The gate runs `osv-scanner scan source --config=osv-scanner.toml --recursive .`
# and must report 0 actionable CVEs.
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not.
#
# Lockfiles scanned (recursive from repo root):
#   - package-lock.json                 (root tooling deps)
#   - apps/web/package-lock.json        (Capacitor/Vite web client)
#   - apps/remake-web/package-lock.json (remake web client)
#   - apps/desktop/package-lock.json    (Electron desktop shell)
#
# Add a dated, reasoned [[IgnoredVulns]] entry below only for a future vuln that is
# genuinely unfixable or provably unreachable, e.g.:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   # 2026-06-17 — <reason: unfixable upstream / not reachable in this product>.

# ---------------------------------------------------------------------------
# RETIRED 2026-11-01 — the 2026-07-25 brace-expansion (CVE-2026-14257,
# GHSA-mh99-v99m-4gvg) ignore EXPIRED 2026-10-23 and is removed. Patched
# backports now exist on every affected line (1.1.21 / 2.1.7 / 5.0.12, verified
# against the npm registry), so all four package.json override floors were
# raised to those versions instead of re-ignoring. The full per-parent analysis
# from 2026-07-25 lives in git history (osv-scanner.toml @ main~).
# ---------------------------------------------------------------------------

# 2026-11-01 — extract-zip symlink path traversal (GHSA-7pqw-9j4j-h8q3) and
# unvalidated symlink path traversal (GHSA-jmr9-qjv8-65gv). GENUINELY
# UNFIXABLE: both advisories list `introduced: 0, last_affected: 2.0.1` and
# 2.0.1 IS the latest published release (npm, verified 2026-11-01) — no patched
# version exists to upgrade to. Scope: dev-only transitive under
# @puppeteer/browsers (the Applitools visual-testing chain, apps/web); it only
# runs when a developer downloads browsers for local e2e, never in CI and never
# in the shipped web/desktop bundle. The advisories are additionally marked
# withdrawn upstream. Re-check: if a patched extract-zip ships, drop these
# entries and bump the dependency.
[[IgnoredVulns]]
id = "GHSA-7pqw-9j4j-h8q3"
reason = "extract-zip symlink path traversal; dev-only transitive under @puppeteer/browsers (Applitools e2e chain, apps/web), not shipped; genuinely unfixable — advisory range is introduced:0 -> last_affected:2.0.1 and 2.0.1 is the latest published release (verified 2026-11-01), and the advisory is withdrawn upstream. Re-review when a patched release ships."

[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
reason = "extract-zip unvalidated symlink path traversal; dev-only transitive under @puppeteer/browsers (Applitools e2e chain, apps/web), not shipped; genuinely unfixable — advisory range is introduced:0 -> last_affected:2.0.1 and 2.0.1 is the latest published release (verified 2026-11-01), and the advisory is withdrawn upstream. Re-review when a patched release ships."

# 2026-11-01 — minimatch DoS via globparts amplification (GHSA-g3hv-75wg-m249,
# 4 residual dev-only copies). PARTIALLY FIXED + GENUINELY UNFIXABLE REMAINDER:
# the advisory range is `introduced: 0 -> fixed: 11.0.1` with NO backport to the
# 3.x/5.x/9.x lines, and all copies that CAN reach 11 were moved there in this
# same change (override `minimatch@10 -> >=11.0.1 <12` in all four
# package.jsons; root/web/desktop/remake-web minimatch@10 and glob@10/glob@13
# copies now resolve 11.0.3 / 14.0.3). Measured effect (osv-scanner 2.3.8,
# 2026-11-01): GHSA-g3hv-75wg-m249 rows 9 -> 4.
#
# The 4 residual copies are pinned by parents that cannot reach 11.0.1:
#   - apps/desktop @electron/asar@3.4.1 -> minimatch ^3.0.4 (app-builder-lib
#     26.15.3 EXACT-PINS @electron/asar 3.4.1 — same lock verified 2026-07-25)
#   - apps/desktop dir-compare@4.2.0 -> ^3.0.5 and glob@7.2.3 -> ^3.1.1
#     (electron-builder chain; latest dir-compare still needs minimatch ^3)
#   - apps/desktop filelist@1.0.6 -> ^5.0.1; @electron/universal@2.0.3 -> ^9.0.3
#     (universal also exact-pinned by app-builder-lib)
#   - apps/web eslint@9.39.5 / @eslint/eslintrc / @eslint/config-array ->
#     minimatch ^3.1.5 (eslint 9 line; eslint 10 drops these but is a breaking
#     major for typescript-eslint 8.65 — the July 2026 analysis, still true)
# Force-upgrading minimatch to 11 under glob@7/filelist was REPRODUCED as
# build-breaking on 2026-07-25 ("TypeError: mm is not a function" — CJS export
# shape change), so the force route is not a fix.
# Scope: dev/build-only copies; none ship in the web, remake-web, or desktop
# runtime bundle.
# EXPIRES 2027-01-30 (~90 days). RE-CHECK AT EXPIRY: (1) has electron-builder
# moved off the @electron/asar + @electron/universal exact pins? (2) is there an
# eslint 10-compatible typescript-eslint allowing the web eslint bump? (3) has
# minimatch shipped a 3.x/5.x/9.x backport? If any: drop this entry and take the
# real fix.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-30
reason = "minimatch globparts-amplification DoS; 4 residual dev-only copies under parents that cannot reach the only fixed version 11.0.1 (app-builder-lib exact-pins @electron/asar 3.4.1 and @electron/universal 2.0.3; dir-compare/glob@7/filelist pin minimatch ^3/^5; web eslint-9 chain pins ^3.1.5) while force-upgrading to 11 under glob@7/filelist was reproduced build-breaking on 2026-07-25; every copy that can reach 11.0.1 was moved there in the same change (9 rows -> 4). Expires 2027-01-30; see the comment block above for the full per-parent analysis and re-check list."
